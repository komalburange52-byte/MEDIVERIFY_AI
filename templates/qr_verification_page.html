<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Verification | MEDIVERIFY AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📱 QR Verification</h1>

        <p class="description">
            Enter the verification URL obtained from a
            MEDIVERIFY AI QR code.
        </p>

        <form onsubmit="verifyQR(event)">

            <label for="verification_url">
                Verification URL
            </label>

            <input
                type="text"
                id="verification_url"
                placeholder="http://127.0.0.1:5000/verify/..."
                required
            >

            <button type="submit">
                Verify QR
            </button>

        </form>

        <div class="notice">
            The QR code contains a secure verification token.
            MEDIVERIFY AI uses this token to retrieve the
            associated verification record.
        </div>

        <a href="{{ url_for('dashboard') }}" class="back">
            ← Back to Dashboard
        </a>

    </div>

    <script>

        function verifyQR(event) {

            event.preventDefault();

            const input =
                document.getElementById(
                    "verification_url"
                );

            const value =
                input.value.trim();

            if (!value) {
                return;
            }

            try {

                const url = new URL(value);

                window.location.href =
                    url.pathname;

            } catch (error) {

                alert(
                    "Please enter a valid MEDIVERIFY AI verification URL."
                );

            }

        }

    </script>

</body>

</html>
